* {

}

body {

    margin: 0;

            rgba(255,255,255,.12),

        radial-gradient(
            circle at 78% 24%,
            rgba(255,255,255,.10),
            transparent 1.5%
        ),
        radial-gradient(
            circle at 35% 70%,
            rgba(255,255,255,.08),
            transparent 2%
        ),
        radial-gradient(
            circle at 90% 82%,

            transparent 1.5%

            180deg,
            #050816,
            #0c1024,
            #171936
        );

    color: #eeeaf4;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    padding: 30px 0;
}

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background-image:
        radial-gradient(
            white 1px,
            transparent 1px
        );

    background-size: 85px 85px;

    opacity: .18;
}

.container {

    position: relative;

    z-index: 1;

    width: min(92%, 600px);

    margin: auto;

    padding: 45px 30px;

    text-align: center;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius: 20px;

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.4);

    backdrop-filter:
        blur(14px);
}

.back {

    position: absolute;

    top: 20px;

    left: 20px;

    color: #aaa4b8;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}

.back:hover {
    color: white;
}

.heart {

    font-size: 38px;

    margin-bottom: 5px;

    color: #e7b8ca;
}

h1 {

    margin:
        5px 0 8px;

    font-size: 48px;

    font-weight: normal;
}

.subtitle {

    margin-bottom: 35px;

    color: #aaa3b6;

    font-style: italic;
}

.menu {

    display: grid;

    gap: 15px;
}

button {

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius: 10px;

    background:
        rgba(255,255,255,.08);

    color: white;

    padding: 15px 20px;

    cursor: pointer;

    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    transition: .2s ease;
}

button:hover {

    background:
        rgba(255,255,255,.16);

    transform:
        translateY(-2px);
}

button:disabled {

    opacity: .45;

    cursor: not-allowed;

    transform: none;
}

.note {

    margin-top: 30px;

    color: #777188;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 1px;
}

input,
select {

    width: 100%;

    padding: 14px;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius: 9px;

    background:
        rgba(255,255,255,.07);

    color: white;

    outline: none;

    font-family: Arial, sans-serif;

    font-size: 13px;
}

input::placeholder {
    color: #858092;
}

input:focus,
select:focus {

    border-color:
        rgba(255,255,255,.3);
}

select option {
    color: black;
}

.question-box {

    display: grid;

        document
        .getElementById("correctAnswer")
        .value;

    if (
        !question ||
        answers.some(
            answer => !answer
        ) ||
        correct === ""
    ) {

        alert(
            "Fill everything in first ❤️"
        );

        return;

    }

    questions.push({

        question:
            question,

        answers:
            answers,

        correct:
            Number(correct)

    });

    document
        .getElementById("question")
        .value = "";

    for (
        let i = 1;
        i <= 4;
        i++
    ) {

        document
        .getElementById(
            "answer" + i
        )
        .value = "";

    }

    document
        .getElementById("correctAnswer")
        .value = "";

    renderQuestions();

}

/* CREATE RANDOM QUESTIONS */

function createRandomQuestions(amount) {

    const shuffled =
        [...randomQuestionBank]
        .sort(
            () =>
                Math.random() - 0.5
        );

    return shuffled
        .slice(
            0,
            Math.min(
                amount,
                shuffled.length
            )
        )
        .map(
            function(question) {

                return {

                    question:
                        question.question,

                    answers:
                        [...question.answers],

                    correct:
                        question.correct

                };

            }
        );

}

/* JOIN ROOM */

async function joinRoom() {

    const name =
        document
        .getElementById("playerName")
        .value
        .trim();

    const roomCode =
        document
        .getElementById("roomCode")
        .value
        .trim();

    const error =
        document
        .getElementById("joinError");

    error.textContent = "";

    if (!name) {

        error.textContent =
            "Enter your name.";

        return;

    }

    if (
        !/^\d{4}$/.test(
            roomCode
        )
    ) {

        error.textContent =
            "Room code must be 4 numbers.";

        return;

    }

    if (!currentUser) {

        error.textContent =
            "You need to be logged in first.";

        return;

    }

    try {

        const roomReference =
            doc(
                db,
                "triviaRooms",
                roomCode
            );

        const snapshot =
            await getDoc(
                roomReference
            );

        if (!snapshot.exists()) {

            error.textContent =
                "That room doesn't exist.";

            return;

        }

        const room =
            snapshot.data();

        if (room.playerId) {

            error.textContent =
                "That room already has a player.";

            return;

        }

        if (
            room.hostId ===
            currentUser.uid
        ) {

            error.textContent =
                "You cannot join your own room.";

            return;

        }

        await updateDoc(
            roomReference,
            {

                playerId:
                    currentUser.uid,

                playerName:
                    name

            }
        );

        currentRoom =
            roomCode;

        showPlayerRoom(
            roomCode
        );

        listenToRoom(
            roomCode
        );

    }

    catch(errorObject) {

        console.error(
            errorObject
        );

        error.textContent =
            "Could not join the room.";

    }

}

/* =========================================================
   HOST VIEW
   ========================================================= */

function updateHostView(room) {

    const status =
        document.getElementById(
            "roomStatus"
        );

    const area =
        document.getElementById(
            "hostQuestionArea"
        );

    if (!status || !area)
        return;


    /* WAITING FOR PLAYER */

    if (!room.playerId) {

        status.innerHTML =
            "Waiting for the other player...";

        area.innerHTML = `

            <div class="empty">
                Give the room code to the other player.
            </div>

        `;

        return;

    }


    /*
     * IMPORTANT
     *
     * room.turn tells us who is currently HOSTING.
     *
     * "host"   = original host is hosting
     * "player" = original player is hosting
     */


    /* PLAYER IS CURRENT HOST */

    if (
        room.turn === "player"
    ) {

        status.innerHTML = `

            It's
            <span class="player-name">
                ${escapeHTML(room.playerName)}
            </span>
            's turn to host ❤️

        `;


        /*
         * The original host is now the ANSWERER.
         *
         * This is the important part that was missing.
         */

        if (
            room.status === "playing" &&
            room.questions &&
            room.questions.length > 0
        ) {

            status.innerHTML = `

                You're answering
                <span class="player-name">
                    ${escapeHTML(room.playerName)}
                </span>
                's questions ❤️

            `;

            const question =
                room.questions[
                    room.currentQuestion
                ];

            if (question) {

                renderPlayerQuestion(
                    room,
                    question,
                    area
                );

            }

            return;

        }


        area.innerHTML = `

            <div class="turn-banner">

                They are creating the next round.

                <br><br>

                You'll answer their questions when they're ready.

            </div>

        `;

        return;

    }


    /* ORIGINAL HOST IS CURRENT HOST */

    status.innerHTML = `

        <span class="player-name">
            ${escapeHTML(room.playerName)}
        </span>

        joined the room ❤️

    `;


    /* FIRST ROUND WAITING */

    if (
        room.status === "waiting"
    ) {

        area.innerHTML = `

            <div class="turn-banner">

                You're hosting the first round.

            </div>

            <button
                id="beginGame"
                class="start-button"
            >
                Start Round
            </button>

        `;

        const beginButton =
            document.getElementById(
                "beginGame"
            );

        if (beginButton) {

            beginButton.onclick =
                async function() {

                    beginButton.disabled =
                        true;

                    try {

                        await updateDoc(

                            doc(
                                db,
                                "triviaRooms",
                                currentRoom
                            ),

                            {
                                status:
                                    "playing"
                            }

                        );

                    }

                    catch(error) {

                        console.error(
                            error
                        );

                        beginButton.disabled =
                            false;

                        alert(
                            "Could not start the round."
                        );

                    }

                };

        }

        return;

    }


    /* FINISHED */

    if (
        room.status === "finished"
    ) {

        showResults(
            room
        );

        return;

    }


    /* PLAYING */

    if (
        room.status === "playing"
    ) {

        const question =
            room.questions?.[
                room.currentQuestion
            ];

        if (!question)
            return;

        renderHostQuestion(
            room,
            question,
            area
        );

    }

}


/* =========================================================
   RENDER HOST QUESTION
   ========================================================= */

function renderHostQuestion(
    room,
    question,
    area
) {

    /*
     * If the current host is the original player,
     * their score is playerScore.
     *
     * If the current host is the original host,
     * their score is hostScore.
     */

    const currentHostIsPlayer =
        room.turn === "player";

    const currentHostScore =
        currentHostIsPlayer
        ? room.playerScore
        : room.hostScore;

    const currentAnswererScore =
        currentHostIsPlayer
        ? room.hostScore
        : room.playerScore;

    const currentHostName =
        currentHostIsPlayer
        ? room.playerName
        : room.hostName;

    const currentAnswererName =
        currentHostIsPlayer
        ? room.hostName
        : room.playerName;


    area.innerHTML = `

        <div class="score-board">

            <div class="score-box">

                <div class="score-number">
                    ${currentHostScore}
                </div>

                <div class="score-name">
                    ${escapeHTML(currentHostName)}
                </div>

            </div>

            <div class="score-box">

                <div class="score-number">
                    ${currentAnswererScore}
                </div>

                <div class="score-name">
                    ${escapeHTML(currentAnswererName)}
                </div>

            </div>

        </div>


        <div class="quiz-question">

            <div class="question-counter">

                Question
                ${room.currentQuestion + 1}
                /
                ${room.questions.length}

            </div>

            <h2>
                ${escapeHTML(question.question)}
            </h2>

            <div class="answers">

                ${question.answers
                    .map(
                        function(answer, index) {

                            return `

                                <button
                                    class="answer-button"
                                    disabled
                                >

                                    <span
                                        class="answer-letter"
                                    >
                                        ${String.fromCharCode(
                                            65 + index
                                        )}
                                    </span>

                                    ${escapeHTML(answer)}

                                </button>

                            `;

                        }
                    )
                    .join("")}

            </div>

            <div class="answer-status">

                ${
                    room.playerAnswered
                    ? "They answered! ❤️"
                    : "Waiting for their answer..."
                }

            </div>

        </div>

    `;


    /*
     * Show which answer they selected.
     */

    if (
        room.playerAnswered &&
        room.playerAnswer !== null
    ) {

        const selected =
            room.playerAnswer;

        const buttons =
            area.querySelectorAll(
                ".answer-button"
            );

        if (
            buttons[selected]
        ) {

            buttons[selected]
                .classList.add(

                    selected ===
                    question.correct

                    ? "correct"

                    : "wrong"

                );

        }


        /*
         * Only the CURRENT HOST advances the round.
         */

        if (
            room.turn ===
            (
                room.hostId ===
                currentUser?.uid
                ? "host"
                : "player"
            )
        ) {

            setTimeout(
                async function() {

                    const latest =
                        await getDoc(
                            doc(
                                db,
                                "triviaRooms",
                                currentRoom
                            )
                        );

                    if (!latest.exists())
                        return;

                    const latestRoom =
                        latest.data();

                    if (
                        latestRoom.playerAnswered
                    ) {

                        moveToNextQuestion(
                            latestRoom
                        );

                    }

                },
                1200
            );

        }

    }

}


/* =========================================================
   PLAYER VIEW
   ========================================================= */

function updatePlayerView(room) {

    const status =
        document.getElementById(
            "playerStatus"
        );

    const area =
        document.getElementById(
            "playerQuestionArea"
        );

    if (!status || !area)
        return;


    /* FINISHED */

    if (
        room.status === "finished"
    ) {

        showResults(
            room
        );

        return;

    }


    /*
     * The original player is the CURRENT HOST
     * when turn === "player".
     */


    if (
        room.turn === "player"
    ) {

        /*
         * CRITICAL FIX:
         *
         * If the player has NOT started their round yet,
         * show the creator.
         *
         * If they HAVE started it,
         * status === "playing" and questions exist,
         * so show the HOST screen instead.
         */

        if (
            room.status !== "playing" ||
            !room.questions ||
            room.questions.length === 0
        ) {

            showPlayerHostSetup(
                room,
                status,
                area
            );

            return;

        }


        /*
         * PLAYER IS NOW HOSTING.
         */

        status.innerHTML = `

            You're hosting this round ❤️

            <br>

            <span class="player-name">
                ${escapeHTML(room.hostName)}
            </span>

            is answering.

        `;


        const question =
            room.questions[
                room.currentQuestion
            ];

        if (!question) {

            area.innerHTML = `

                <div class="empty">
                    Waiting for the round to load...
                </div>

            `;

            return;

        }


        renderHostQuestion(
            room,
            question,
            area
        );

        return;

    }


    /* ORIGINAL PLAYER IS ANSWERING */

    if (
        room.status === "waiting"
    ) {

        status.innerHTML =
            "Waiting for the host to start...";

        area.innerHTML = `

            <div class="empty">
                Get ready ❤️
            </div>

        `;

        return;

    }


    if (
        room.status === "playing"
    ) {

        status.innerHTML = `

            You're playing against
            <span class="player-name">
                ${escapeHTML(room.hostName)}
            </span>

        `;

        const question =
            room.questions[
                room.currentQuestion
            ];

        if (!question)
            return;

        renderPlayerQuestion(
            room,
            question,
            area
        );

    }

}

                    question:
                        question,

                    answers:
                        answers,

                    correct:
                        Number(correct)

                });


                render();

            };


        /*
         * START THEIR ROUND
         */

        document
            .getElementById(
                "playerStartRound"
            )
            .onclick =
            async function() {

                if (
                    playerQuestions.length === 0
                ) {

                    alert(
                        "Add at least one question first ❤️"
                    );

                    return;

                }


                const startButton =
                    document.getElementById(
                        "playerStartRound"
                    );

                startButton.disabled =
                    true;


                await startPlayerTurn(
                    playerQuestions
                );

            };

    }


    render();

}


/* =========================================================
   START PLAYER TURN
   ========================================================= */

async function startPlayerTurn(
    playerQuestions
) {

    if (
        !playerQuestions ||
        playerQuestions.length === 0
    ) {

        alert(
            "Add at least one question first ❤️"
        );

        return;

    }


    try {

        await updateDoc(

            doc(
                db,
                "triviaRooms",
                currentRoom
            ),

            {

                questions:
                    playerQuestions,

                currentQuestion:
                    0,

                playerAnswer:
                    null,

                playerAnswered:
                    false,

                status:
                    "playing",

                turn:
                    "player"

            }

        );

    }

    catch(error) {

        console.error(
            error
        );

        alert(
            "Could not start the round. Check your Firebase rules."
        );

    }

}


/* =========================================================
   PLAYER QUESTION
   ========================================================= */

function renderPlayerQuestion(
    room,
    question,
    area
) {

    /*
     * Determine whose score belongs to the person
     * currently answering.
     */

    const answeringIsOriginalPlayer =
        room.turn === "host";

    const myScore =
        answeringIsOriginalPlayer
        ? room.playerScore
        : room.hostScore;

    const opponentScore =
        answeringIsOriginalPlayer
        ? room.hostScore
        : room.playerScore;

    const opponentName =
        answeringIsOriginalPlayer
        ? room.hostName
        : room.playerName;


    area.innerHTML = `

        <div class="score-board">

            <div class="score-box">

                <div class="score-number">
                    ${myScore}
                </div>

                <div class="score-name">
                    You
                </div>

            </div>

            <div class="score-box">

                <div class="score-number">
                    ${opponentScore}
                </div>

                <div class="score-name">
                    ${escapeHTML(opponentName)}
                </div>

            </div>

        </div>


        <div class="quiz-question">

            <div class="question-counter">

                Question
                ${room.currentQuestion + 1}
                /
                ${room.questions.length}

            </div>

            <h2>
                ${escapeHTML(question.question)}
            </h2>


            <div
                class="answers"
                id="answerButtons"
            >

                ${question.answers
                    .map(
                        function(answer, index) {

                            return `

                                <button
                                    class="answer-button"
                                    data-answer="${index}"
                                    ${
                                        room.playerAnswered
                                        ? "disabled"
                                        : ""
                                    }
                                >

                                    <span
                                        class="answer-letter"
                                    >
                                        ${String.fromCharCode(
                                            65 + index
                                        )}
                                    </span>

                                    ${escapeHTML(answer)}

                                </button>

                            `;

                        }
                    )
                    .join("")}

            </div>


            <div class="answer-status">

                ${
                    room.playerAnswered
                    ? "Answer submitted. ❤️"
                    : "Choose your answer."
                }

            </div>

        </div>

    `;


    /*
     * Answer buttons
     */

    area
        .querySelectorAll(
            ".answer-button"
        )
        .forEach(
            function(button) {

                button.onclick =
                    function() {

                        submitPlayerAnswer(

                            Number(
                                button.dataset.answer
                            ),

                            room

                        );

                    };

            }
        );


    /*
     * Show selected answer
     */

    if (
        room.playerAnswered &&
        room.playerAnswer !== null
    ) {

        const buttons =
            area.querySelectorAll(
                ".answer-button"
            );

        const selected =
            room.playerAnswer;

        if (
            buttons[selected]
        ) {

            buttons[selected]
                .classList.add(

                    selected ===
                    question.correct

                    ? "correct"

                    : "wrong"

                );

        }

    }

}


/* =========================================================
   SUBMIT ANSWER
   ========================================================= */

async function submitPlayerAnswer(
    answer,
    room
) {

    if (
        room.playerAnswered
    )
        return;


    const question =
        room.questions[
            room.currentQuestion
        ];


    const correct =
        answer ===
        question.correct;


    try {

        /*
         * The person answering is always:
         *
         * playerScore when host is hosting
         * hostScore when player is hosting
         */

        const scoreField =
            room.turn === "host"
            ? "playerScore"
            : "hostScore";


        const currentScore =
            room.turn === "host"
            ? room.playerScore
            : room.hostScore;


        const update = {

            playerAnswer:
                answer,

            playerAnswered:
                true

        };


        update[scoreField] =
            correct
            ? currentScore + 1
            : currentScore;


        await updateDoc(

            doc(
                db,
                "triviaRooms",
                currentRoom
            ),

            update

        );

    }

    catch(error) {

        console.error(
            error
        );

    }

}


/* =========================================================
   MOVE TO NEXT QUESTION / TURN
   ========================================================= */

async function moveToNextQuestion(
    room
) {

    if (advancing)
        return;


    advancing = true;


    try {

        /*
         * MORE QUESTIONS IN THIS TURN
         */

        if (
            room.currentQuestion + 1 <
            room.questions.length
        ) {

            await updateDoc(

                doc(
                    db,
                    "triviaRooms",
                    currentRoom
                ),

                {

                    currentQuestion:
                        room.currentQuestion + 1,

                    playerAnswer:
                        null,

                    playerAnswered:
                        false

                }

            );

        }


        /*
         * THIS TURN IS FINISHED
         */

        else {


            /*
             * ORIGINAL HOST FINISHED.
             *
             * Now original player becomes host.
             */

            if (
                room.turn === "host"
            ) {

                await updateDoc(

                    doc(
                        db,
                        "triviaRooms",
                        currentRoom
                    ),

                    {

                        turn:
                            "player",

                        status:
                            "playing",

                        questions:
                            [],

                        currentQuestion:
                            0,

                        playerAnswer:
                            null,

                        playerAnswered:
                            false,

                        roundNumber:
                            (room.roundNumber || 1) + 1

                    }

                );

            }


            /*
             * ORIGINAL PLAYER FINISHED.
             *
             * Both players have now hosted.
             */

            else {

                await updateDoc(

                    doc(
                        db,
                        "triviaRooms",
                        currentRoom
                    ),

                    {

                        status:
                            "finished",

                        playerAnswer:
                            null,

                        playerAnswered:
                            false

                    }

                );


                saveScoreHistory(
                    room
                );

            }

        }

    }

    catch(error) {

        console.error(
            error
        );

    }


    setTimeout(
        function() {

            advancing = false;

        },
        500
    );

}


/* =========================================================
   SAVE SCORE HISTORY
   ========================================================= */

async function saveScoreHistory(
    room
) {

    if (!currentUser)
        return;


    try {

        await addDoc(

            collection(
                db,
                "triviaScores"
            ),

            {

                hostName:
                    room.hostName,

                playerName:
                    room.playerName,

                hostScore:
                    room.hostScore,

                playerScore:
                    room.playerScore,

                finishedAt:
                    Date.now()

            }

        );

    }

    catch(error) {

        console.error(
            "Could not save score history:",
            error
        );

    }

}


/* =========================================================
   RESULTS
   ========================================================= */

function showResults(
    room
) {

    const myScore =
        currentUser?.uid ===
        room.hostId
        ? room.hostScore
        : room.playerScore;


    const opponentScore =
        currentUser?.uid ===
        room.hostId
        ? room.playerScore
        : room.hostScore;


    const myName =
        currentUser?.uid ===
        room.hostId
        ? room.hostName
        : room.playerName;


    const opponentName =
        currentUser?.uid ===
        room.hostId
        ? room.playerName
        : room.hostName;


    let result;


    if (
        myScore >
        opponentScore
    ) {

        result =
            "You win! 🏆❤️";

    }

    else if (
        myScore <
        opponentScore
    ) {

        result =
            "They win! ❤️";

    }

    else {

        result =
            "It's a tie! 🤝";

    }


    container.innerHTML = `

        <div class="heart">
            ♥
        </div>

        <h1>
            Round Complete
        </h1>

        <p class="subtitle">
            ${result}
        </p>


        <div class="score-board">

            <div class="score-box">

                <div class="score-number">
                    ${myScore}
                </div>

                <div class="score-name">
                    ${escapeHTML(myName)}
                </div>

            </div>


            <div class="score-box">

                <div class="score-number">
                    ${opponentScore}
                </div>

                <div class="score-name">
                    ${escapeHTML(opponentName)}
                </div>

            </div>

        </div>


        <button
            id="backHome"
            class="start-button"
        >
            Back to Trivia
        </button>

    `;


    document
        .getElementById("backHome")
        .onclick =
        showMenu;

}


/* =========================================================
   MENU
   ========================================================= */

function showMenu() {

    if (roomListener) {

        roomListener();

        roomListener =
            null;

    }


    currentRoom =
        null;


    questions = [];


    advancing =
        false;


    container.innerHTML = `

        <a
            class="back"
            href="index.html"
        >
            ← Back
        </a>

        <div class="heart">
            ♥
        </div>

        <h1>
            Trivia
        </h1>

        <p class="subtitle">
            How well do you know each other?
        </p>

        <div class="menu">

            <button id="hostButton">
                Host a Round
            </button>

            <button id="joinButton">
                Join a Round
            </button>

        </div>

        <div class="note">
            A little game for just the two of us
        </div>

    `;


    document
        .getElementById("hostButton")
        .onclick =
        showHostSetup;


    document
        .getElementById("joinButton")
        .onclick =
        showJoinScreen;

}


/* =========================================================
   ROOM CODE
   ========================================================= */

function generateRoomCode() {

    return String(

        Math.floor(
            1000 +
            Math.random() * 9000
        )

    );

}


/* =========================================================
   USER NAME
   ========================================================= */

function getUserName() {

    if (
        currentUser?.displayName
    ) {

        return currentUser.displayName;

    }


    if (
        currentUser?.email
    ) {

        return currentUser.email
            .split("@")[0];

    }


    return "Player";

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(text);

    return div.innerHTML;

}
