body::before {

    content: "";

            transparent 1px

    background-size: 85px 85px;

    opacity: .18;
}

    position: relative;

    z-index: 1;

    text-align: center;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius: 20px;

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.4);

    backdrop-filter:
        blur(14px);

.back {

    position: absolute;

    top: 20px;

    left: 20px;

    color: #aaa4b8;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

.heart {

.subtitle {

}

.menu {

    display: grid;

}

        rgba(255,255,255,.08);

    cursor: pointer;

    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    transition: .2s ease;
}

button:hover {

    background:
        rgba(255,255,255,.16);

    transform:
        translateY(-2px);
}

button:disabled {

    opacity: .45;

    cursor: not-allowed;

}

        .value
        .trim()

    ];

    const correct =
        document
        .getElementById("correctAnswer")
        .value;

    if (
        !question ||
        answers.some(
            answer => !answer
        ) ||
        correct === ""
    ) {

        alert(
            "Fill everything in first ❤️"
        );

        return;

    }

    questions.push({

        question:
            question,

        answers:
            answers,

        correct:
            Number(correct)

    });

    document
        .getElementById("question")
        .value = "";

    for (
        let i = 1;
        i <= 4;
        i++
    ) {

        document
        .getElementById(
            "answer" + i
        )
        .value = "";

    }

    document
        .getElementById("correctAnswer")
        .value = "";

    renderQuestions();

}

/* =========================================================
   RANDOM QUESTION CREATOR
========================================================= */

function createRandomQuestions(amount) {

    const shuffled =
        [...randomQuestionBank]
        .sort(
            () =>
                Math.random() - 0.5
        );

    return shuffled
        .slice(
            0,
            Math.min(
                amount,
                shuffled.length
            )
        )
        .map(
            function(question) {

                return {

                    question:
                        question.question,

                    answers:
                        [...question.answers],

                    correct:
                        question.correct

                };

            }
        );

}

async function createRoom() {

        questions.length === 0
    ) {

        );

        return;

    }

    if (!currentUser) {

        alert(
            "You need to be logged in first."
        );

        return;

    }

    try {

        let roomCode;

        let exists = true;

        while (exists) {

            roomCode =
                generateRoomCode();

            const check =
                await getDoc(
                    doc(
                        db,
                        "triviaRooms",
                        roomCode
                    )
                );

            exists =
                check.exists();

        }

        const room = {

            hostId:
                currentUser.uid,

            hostName:
                getUserName(),

            playerId:
                "",

            playerName:
                "",

            questions:
                questions,

            currentQuestion:
                0,

            hostScore:
                0,

            playerScore:
                0,

            playerAnswer:
                null,

            playerAnswered:
                false,

            status:
                "waiting",

            /*
             * "host" means host created
             * the current questions.
             *
             * "player" means player created
             * the current questions.
             */

            turn:
                "host",

            roundNumber:
                1,

            createdAt:
                Date.now(),

            scoreSaved:
                false

        };

        await setDoc(
            doc(
                db,
                "triviaRooms",
                roomCode
            ),
            room
        );

        currentRoom =
            roomCode;

        showHostRoom(
            roomCode
        );

        listenToRoom(
            roomCode
        );

    }

    catch(error) {

        console.error(error);

        alert(
            "Could not create the room. Check your Firebase rules."
        );

    }

/* =========================================================

========================================================= */

async function joinRoom() {

    const name =
        document
        .getElementById("playerName")
        .value
        .trim();

    const roomCode =
        document
        .getElementById("roomCode")
        .value
        .trim();

    const error =
        document
        .getElementById("joinError");

    error.textContent = "";

    if (!name) {

        error.textContent =
            "Enter your name.";

        return;

    }

    if (
        !/^\d{4}$/.test(
            roomCode
        )
    ) {

        error.textContent =
            "Room code must be 4 numbers.";

        return;

    }

    if (!currentUser) {

        error.textContent =
            "You need to be logged in first.";

        return;

    }

    try {

        const roomReference =
            doc(
                db,
                "triviaRooms",
                roomCode
            );

        const snapshot =
            await getDoc(
                roomReference
            );

        if (!snapshot.exists()) {

            error.textContent =
                "That room doesn't exist.";

            return;

        }

        const room =
            snapshot.data();

        if (room.playerId) {

            error.textContent =
                "That room already has a player.";

            return;

        }

        if (
            room.hostId ===
            currentUser.uid
        ) {

            error.textContent =
                "You cannot join your own room.";

            return;

        }

        await updateDoc(
            roomReference,
            {

                playerId:
                    currentUser.uid,

                playerName:
                    name

            }
        );

        currentRoom =
            roomCode;

        showPlayerRoom(
            roomCode
        );

        listenToRoom(
            roomCode
        );

    }

    catch(errorObject) {

        console.error(
            errorObject
        );

        error.textContent =
            "Could not join the room.";

    }

}

/* =========================================================
   HOST VIEW
========================================================= */

function updateHostView(
    room
) {

    const status =
        document.getElementById(
            "roomStatus"
        );

    const area =
        document.getElementById(
            "hostQuestionArea"
        );

    if (!status || !area)
        return;


    /* PLAYER HAS NOT JOINED */

    if (!room.playerId) {

        status.innerHTML =
            "Waiting for the other player...";

        area.innerHTML = `

            <div class="empty">
                Give the room code to the other player.
            </div>

        `;

        return;

    }


    /* GAME FINISHED */

    if (
        room.status === "finished"
    ) {

        showResults(room);

        return;

    }


    /* PLAYER IS CREATING THEIR ROUND */

    if (
        room.status === "creating" &&
        room.turn === "player"
    ) {

        status.innerHTML = `

            It's
            <span class="player-name">
                ${escapeHTML(room.playerName)}
            </span>'s turn to create questions ❤️

        `;

        area.innerHTML = `

            <div class="turn-banner">

                They're making your questions now.

                <br><br>

                You'll answer them when they're ready.

            </div>

        `;

        return;

    }


    /* INITIAL WAITING STATE */

    if (
        room.status === "waiting"
    ) {

        status.innerHTML = `

            <span class="player-name">
                ${escapeHTML(room.playerName)}
            </span>

            joined the room ❤️

        `;

        area.innerHTML = `

            <div class="turn-banner">

                You're hosting the first round.

            </div>

            <button
                id="beginGame"
                class="start-button"
            >
                Start Round
            </button>

        `;

        document
            .getElementById("beginGame")
            .onclick =
            async function() {

                await updateDoc(

                    doc(
                        db,
                        "triviaRooms",
                        currentRoom
                    ),

                    {

                        status:
                            "playing",

                        currentQuestion:
                            0,

                        playerAnswer:
                            null,

                        playerAnswered:
                            false

                    }

                );

            };

        return;

    }


    /* PLAYING */

    if (
        room.status === "playing"
    ) {

        /*
         * The host is always the creator
         * during the first turn.
         *
         * During the second turn,
         * the host is the person answering.
         */

        const question =
            room.questions[
                room.currentQuestion
            ];

        if (!question)
            return;


        if (
            room.turn === "host"
        ) {

            status.innerHTML = `

                <span class="player-name">
                    ${escapeHTML(room.playerName)}
                </span>

                is answering your questions ❤️

            `;

        }

        else {

            status.innerHTML = `

                You're answering
                <span class="player-name">
                    ${escapeHTML(room.playerName)}
                </span>'s questions ❤️

            `;

        }


        renderQuestionForHost(
            room,
            question,
            area
        );

    }

}

========================================================= */

function renderQuestionForHost(
    room,
    question,
    area
) {

    area.innerHTML = `

        <div class="score-board">

            <div class="score-box">

                <div class="score-number">
                    ${room.hostScore}
                </div>

                <div class="score-name">

                </div>

            </div>

                <div class="score-number">
                    ${room.playerScore}
                </div>

                <div class="score-name">
                    ${escapeHTML(room.playerName)}
                </div>

            </div>

        </div>

        <div class="quiz-question">

            <div class="question-counter">

                Question
                ${room.currentQuestion + 1}
                /
                ${room.questions.length}

            </div>

            <h2>
                ${escapeHTML(question.question)}
            </h2>

            <div class="answers">

                ${question.answers
                    .map(
                        function(answer, index) {

                            return `

                                <button
                                    class="answer-button"
                                    disabled
                                >

                                    <span
                                        class="answer-letter"
                                    >
                                        ${String.fromCharCode(
                                            65 + index
                                        )}
                                    </span>

                                    ${escapeHTML(answer)}

                                </button>

                            `;

                        }
                    )
                    .join("")}

            </div>

            <div class="answer-status">

                ${
                    room.playerAnswered
                    ? "Answer received! ❤️"
                    : "Waiting for their answer..."
                }

            </div>

        </div>

    `;


    /* SHOW ANSWER */

    if (
        room.playerAnswered &&
        room.playerAnswer !== null
    ) {

        const buttons =
            area.querySelectorAll(
                ".answer-button"
            );

        const selected =
            room.playerAnswer;

        if (
            buttons[selected]
        ) {

            buttons[selected]
                .classList.add(
                    selected ===
                    question.correct
                    ? "correct"
                    : "wrong"
                );

        }

    }


    /*
     * ONLY THE HOST CONTROLS MOVING
     * TO THE NEXT QUESTION.
     *
     * This prevents both browsers
     * from changing the room at once.
     */

    if (
        room.playerAnswered &&
        !advancing
    ) {

        advancing = true;

        setTimeout(
            async function() {

                try {

                    const latest =
                        await getDoc(
                            doc(
                                db,
                                "triviaRooms",
                                currentRoom
                            )
                        );

                    if (!latest.exists()) {

                        advancing = false;

                        return;

                    }

                    const latestRoom =
                        latest.data();

                    if (
                        latestRoom.status === "playing" &&
                        latestRoom.playerAnswered
                    ) {

                        await moveToNextQuestion(
                            latestRoom
                        );

                    }

                }

                catch(error) {

                    console.error(error);

                }

                advancing = false;

            },
            1200
        );

    }

}

     *
     * If the host created the questions,
     * the PLAYER is answering.
     */

    const answering =
        room.turn === "host"
        ? room.playerName
        : room.hostName;


    area.innerHTML = `

        <div class="score-board">

            <div class="score-box">

                <div class="score-number">
                    ${room.playerScore}
                </div>

                <div class="score-name">
                    You
                </div>

            </div>

            <div class="score-box">

                <div class="score-number">
                    ${room.hostScore}
                </div>

                <div class="score-name">
                    ${escapeHTML(room.hostName)}
                </div>

            </div>

        </div>

        <div class="quiz-question">

            <div class="question-counter">

                Question
                ${room.currentQuestion + 1}
                /
                ${room.questions.length}

            </div>

            <h2>
                ${escapeHTML(question.question)}
            </h2>

            <div
                class="answers"
                id="answerButtons"
            >

                ${question.answers
                    .map(
                        function(answer, index) {

                            return `

                                <button
                                    class="answer-button"
                                    data-answer="${index}"
                                    ${
                                        room.playerAnswered
                                        ? "disabled"
                                        : ""
                                    }
                                >

                                    <span
                                        class="answer-letter"
                                    >
                                        ${String.fromCharCode(
                                            65 + index
                                        )}
                                    </span>

                                    ${escapeHTML(answer)}

                                </button>

                            `;

                        }
                    )
                    .join("")}

            </div>

            <div class="answer-status">

                ${
                    room.playerAnswered
                    ? "Answer submitted. ❤️"
                    : "Choose your answer."
                }

            </div>

        </div>

    `;


    area
        .querySelectorAll(
            ".answer-button"
        )
        .forEach(
            function(button) {

                button.onclick =
                    function() {

                        submitAnswer(
                            Number(
                                button.dataset.answer
                            ),
                            room
                        );

                    };

            }
        );


    if (
        room.playerAnswered &&
        room.playerAnswer !== null
    ) {

        const buttons =
            area.querySelectorAll(
                ".answer-button"
            );

        const selected =
            room.playerAnswer;


        if (
            buttons[selected]
        ) {

            buttons[selected]
                .classList.add(
                    selected ===
                    question.correct
                    ? "correct"
                    : "wrong"
                );

        }

    }

}


/* =========================================================
   SUBMIT ANSWER
========================================================= */

async function submitAnswer(
    answer,
    room
) {

    if (
        room.playerAnswered
    )
        return;


    const question =
        room.questions[
            room.currentQuestion
        ];


    if (!question)
        return;


    const correct =
        answer ===
        question.correct;


    /*
     * turn tells us WHO CREATED
     * the questions.
     *
     * If host created them,
     * player gets the point.
     *
     * If player created them,
     * host gets the point.
     */

    const scoreField =
        room.turn === "host"
        ? "playerScore"
        : "hostScore";


    const currentScore =
        room.turn === "host"
        ? room.playerScore
        : room.hostScore;


    const update = {

        playerAnswer:
            answer,

        playerAnswered:
            true

    };


    if (correct) {

        update[scoreField] =
            currentScore + 1;

    }


    try {

        await updateDoc(

            doc(
                db,
                "triviaRooms",
                currentRoom
            ),

            update

        );

    }

    catch(error) {

        console.error(
            error
        );

    }

}


/* =========================================================
   MOVE TO NEXT QUESTION
========================================================= */

async function moveToNextQuestion(
    room
) {

    try {

        /*
         * MORE QUESTIONS IN THIS TURN
         */

        if (
            room.currentQuestion + 1 <
            room.questions.length
        ) {

            await updateDoc(

                doc(
                    db,
                    "triviaRooms",
                    currentRoom
                ),

                {

                    currentQuestion:
                        room.currentQuestion + 1,

                    playerAnswer:
                        null,

                    playerAnswered:
                        false

                }

            );

            return;

        }


        /*
         * CURRENT TURN IS FINISHED.
         */

        if (
            room.turn === "host"
        ) {

            /*
             * YOU hosted first.
             *
             * Now Ainy gets to create
             * her round.
             */

            await updateDoc(

                doc(
                    db,
                    "triviaRooms",
                    currentRoom
                ),

                {

                    turn:
                        "player",

                    status:
                        "creating",

                    questions:
                        [],

                    currentQuestion:
                        0,

                    playerAnswer:
                        null,

                    playerAnswered:
                        false,

                    roundNumber:
                        2

                }

            );

        }

        else {

            /*
             * Ainy hosted second.
             *
             * Both turns are complete.
             */

            await updateDoc(

                doc(
                    db,
                    "triviaRooms",
                    currentRoom
                ),

                {

                    status:
                        "finished",

                    playerAnswer:
                        null,

                    playerAnswered:
                        false

                }

            );


            /*
             * Only the host saves
             * the history.
             */

            if (
                currentUser?.uid ===
                room.hostId &&
                !room.scoreSaved
            ) {

                await saveScoreHistory(
                    room
                );

            }

        }

    }

    catch(error) {

        console.error(
            error
        );

    }

}


/* =========================================================
   SAVE SCORE HISTORY
========================================================= */

async function saveScoreHistory(
    room
) {

    if (!currentUser)
        return;


    try {

        await addDoc(

            collection(
                db,
                "triviaScores"
            ),

            {

                hostId:
                    room.hostId,

                playerId:
                    room.playerId,

                hostName:
                    room.hostName,

                playerName:
                    room.playerName,

                hostScore:
                    room.hostScore,

                playerScore:
                    room.playerScore,

                finishedAt:
                    Date.now()

            }

        );


        /*
         * Mark it saved so the host
         * doesn't accidentally create
         * multiple history entries.
         */

        await updateDoc(

            doc(
                db,
                "triviaRooms",
                currentRoom
            ),

            {

                scoreSaved:
                    true

            }

        );

    }

    catch(error) {

        console.error(
            "Could not save score history:",
            error
        );

    }

}


/* =========================================================
   RESULTS
========================================================= */

function showResults(
    room
) {

    const myScore =
        currentUser?.uid ===
        room.hostId
        ? room.hostScore
        : room.playerScore;


    const opponentScore =
        currentUser?.uid ===
        room.hostId
        ? room.playerScore
        : room.hostScore;


    const myName =
        currentUser?.uid ===
        room.hostId
        ? room.hostName
        : room.playerName;


    const opponentName =
        currentUser?.uid ===
        room.hostId
        ? room.playerName
        : room.hostName;


    let result;


    if (
        myScore >
        opponentScore
    ) {

        result =
            "You win! 🏆❤️";

    }

    else if (
        myScore <
        opponentScore
    ) {

        result =
            "They win! ❤️";

    }

    else {

        result =
            "It's a tie! 🤝";

    }


    container.innerHTML = `

        <div class="heart">
            ♥
        </div>

        <h1>
            Round Complete
        </h1>

        <p class="subtitle">
            ${result}
        </p>

        <div class="score-board">

            <div class="score-box">

                <div class="score-number">
                    ${myScore}
                </div>

                <div class="score-name">
                    ${escapeHTML(myName)}
                </div>

            </div>

            <div class="score-box">

                <div class="score-number">
                    ${opponentScore}
                </div>

                <div class="score-name">
                    ${escapeHTML(opponentName)}
                </div>

            </div>

        </div>

        <button
            id="backHome"
            class="start-button"
        >
            Back to Trivia
        </button>

    `;


    document
        .getElementById("backHome")
        .onclick =
        showMenu;

}


/* =========================================================
   MENU
========================================================= */

function showMenu() {

    if (roomListener) {

        roomListener();

        roomListener =
            null;

    }


    currentRoom =
        null;

    questions = [];


    container.innerHTML = `

        <a
            class="back"
            href="index.html"
        >
            ← Back
        </a>

        <div class="heart">
            ♥
        </div>

        <h1>
            Trivia
        </h1>

        <p class="subtitle">
            How well do you know each other?
        </p>

        <div class="menu">

            <button id="hostButton">
                Host a Round
            </button>

            <button id="joinButton">
                Join a Round
            </button>

        </div>

        <div class="note">
            A little game for just the two of us
        </div>

    `;


    document
        .getElementById("hostButton")
        .onclick =
        showHostSetup;


    document
        .getElementById("joinButton")
        .onclick =

}


/* =========================================================
   ROOM CODE
========================================================= */

function generateRoomCode() {

    return String(

        Math.floor(
            1000 +
            Math.random() * 9000
        )

    );

}


/* =========================================================
   USER NAME
========================================================= */

function getUserName() {

    if (
        currentUser?.displayName
    ) {

        return currentUser.displayName;

    }


    if (
        currentUser?.email
    ) {

        return currentUser.email
            .split("@")[0];

    }


    return "Player";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(text);

    return div.innerHTML;

}
