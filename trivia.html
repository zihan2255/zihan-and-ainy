/* =========================
   RANDOM QUESTIONS
========================= */

function getRandomQuestions(
    amount,
    category
) {

    let available =
        [...questionBank];


    if (
        category !== "Random"
    ) {

        available =
            available.filter(
                question =>
                    question.category ===
                    category
            );

    }


    /*
        Fisher-Yates shuffle.
        This means the questions
        are randomly rearranged.
    */

    for (
        let i =
            available.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            available[i],
            available[j]
        ] =
        [
            available[j],
            available[i]
        ];

    }


    return available.slice(
        0,
        Math.min(
            amount,
            available.length
        )
    );

}

/* =========================
   ADD CUSTOM QUESTION
========================= */

function addQuestion() {

    const question =
        document
        .getElementById("question")
        .value
        .trim();


    const answers = [

        document
        .getElementById("answer1")
        .value
        .trim(),

        document
        .getElementById("answer2")
        .value
        .trim(),

        document
        .getElementById("answer3")
        .value
        .trim(),

        document
        .getElementById("answer4")
        .value
        .trim()

    ];


    const correct =
        document
        .getElementById("correctAnswer")
        .value;


    if (
        !question ||
        answers.some(
            answer =>
                !answer
        ) ||
        correct === ""
    ) {

        alert(
            "Fill everything in first ❤️"
        );

        return;

    }


    questions.push({

        question:
            question,

        answers:
            answers,

        correct:
            Number(correct),

        category:
            "Custom"

    });


    document
        .getElementById("question")
        .value = "";


    for (
        let i = 1;
        i <= 4;
        i++
    ) {

        document
        .getElementById(
            "answer" + i
        )
        .value = "";

    }


    document
        .getElementById("correctAnswer")
        .value = "";


    renderQuestions();

}


/* =========================
   DISPLAY CUSTOM QUESTIONS
========================= */

function renderQuestions() {

    const list =
        document
        .getElementById(
            "questionList"
        );


    if (!list)
        return;


    list.innerHTML = "";


    if (
        questions.length === 0
    ) {

        list.innerHTML = `

            <div class="empty">
                No questions yet.
            </div>

        `;

        return;

    }


    questions.forEach(
        function(
            item,
            index
        ) {

            const card =
                document
                .createElement(
                    "div"
                );


            card.className =
                "question-card";


            card.innerHTML = `

                <div class="question-number">
                    Question ${index + 1}
                </div>


                <div class="question-text">
                    ${escapeHTML(
                        item.question
                    )}
                </div>


                <div class="answer-line">

                    A.
                    ${escapeHTML(
                        item.answers[0]
                    )}

                    <br>

                    B.
                    ${escapeHTML(
                        item.answers[1]
                    )}

                    <br>

                    C.

                    <br>

                    ${escapeHTML(

                    )}

/* =========================
   CREATE ROOM
========================= */

async function createRoom() {

    const mode =
        document
        .getElementById(
            "questionMode"
        );


    /*
        If Random mode is selected,
        generate the questions now.

        This happens ONLY once on
        the host's device.

        Those exact questions are
        then saved inside Firebase,
        so both players see the
        same round.
    */

    if (
        mode &&
        mode.value === "random"
    ) {

        const amount =
            Number(
                document
                .getElementById(
                    "questionAmount"
                )
                .value
            );


        const category =
            document
            .getElementById(
                "questionCategory"
            )
            .value;


        questions =
            getRandomQuestions(
                amount,
                category
            );

    }


    if (
        questions.length === 0
    ) {

        alert(
            "Add at least one question first ❤️"
        );

        return;

    }


    if (!currentUser) {

        alert(
            "You need to be logged in first."
        );

        return;

    }


    const roomCode =
        generateRoomCode();


    const room = {

        hostId:
            currentUser.uid,

        hostName:
            currentUser.email
            ? currentUser.email.split("@")[0]
            : "Host",

        playerId:
            "",

        playerName:
            "",

        questions:
            questions,

        currentQuestion:
            0,

        hostScore:
            0,

        playerScore:
            0,

        playerAnswer:
            null,

        playerAnswered:
            false,

        status:
            "waiting",

        createdAt:
            Date.now()

    };


    try {

        await setDoc(
            doc(
                db,
                "triviaRooms",
                roomCode
            ),
            room
        );


        currentRoom =
            roomCode;


        showHostRoom(
            roomCode
        );


        listenToRoom(
            roomCode
        );

    }

    catch(error) {

        console.error(
            error
        );

        alert(
            "Could not create the room. Check your Firebase rules."
        );

    }

}

/* =========================

function listenToRoom(
    roomCode
) {

    if (roomListener) {

        roomListener();

    }


    roomListener =
        onSnapshot(

            doc(
                db,
                "triviaRooms",
                roomCode
            ),

            function(snapshot) {

                if (
                    !snapshot.exists()
                ) {

                    alert(
                        "This room no longer exists."
                    );

                    showMenu();

                    return;

                }


                const room =
                    snapshot.data();


                currentRoom =
                    roomCode;


                if (
                    room.hostId ===
                    currentUser?.uid
                ) {

                    updateHostView(
                        room
                    );

                }

                else {

                    updatePlayerView(
                        room
                    );

                }

            },

            function(error) {

                console.error(
                    error
                );

            }

        );

    if (

        "waiting"
    ) {

        area.innerHTML = `

                id="beginGame"
                class="start-button"
            >
                Start Round
            </button>

        `;


        document
            .getElementById(
                "beginGame"
            )

                        db,
                        "triviaRooms",
                        currentRoom
                    ),

                    {
                        status:
                            "playing"
                    }

                );

            };


        return;

    }


    if (
        room.status ===
        "finished"
    ) {

        showResults(
            room
        );

        return;

    }


    const question =
        room.questions[
            room.currentQuestion
        ];


    if (!question)
        return;


    area.innerHTML = `

        <div class="score-board">

            <div class="score-box">

                <div class="score-number">
                    ${room.hostScore}
                </div>

                <div class="score-name">
                    You
                </div>

            </div>


            <div class="score-box">

                <div class="score-number">
                    ${room.playerScore}
                </div>

                <div class="score-name">
                    ${escapeHTML(
                        room.playerName
                    )}
                </div>

            </div>

        </div>


        <div class="quiz-question">

            <div class="question-counter">

                Question
                ${room.currentQuestion + 1}
                /
                ${room.questions.length}

            </div>


            <h2>
                ${escapeHTML(
                    question.question
                )}
            </h2>


            <div class="answers">

                ${question.answers
                    .map(
                        function(
                            answer,
                            index
                        ) {

                            return `

                                <button
                                    class="answer-button"
                                    disabled
                                >

                                    <span
                                        class="answer-letter"
                                    >
                                        ${String.fromCharCode(
                                            65 + index
                                        )}
                                    </span>

                                    ${escapeHTML(
                                        answer
                                    )}

                                </button>

                            `;

                        }
                    )
                    .join("")}

            </div>


            <div class="answer-status">

                ${
                    room.playerAnswered
                    ? "The other player has answered! ❤️"
                    : "Waiting for their answer..."
                }

            </div>

        </div>

    `;


    if (
        room.playerAnswered
    ) {

        const selected =
            room.playerAnswer;


        const buttons =
            area.querySelectorAll(
                ".answer-button"
            );


        if (
            buttons[selected]
        ) {

            buttons[
                selected
            ].classList.add(

                selected ===
                question.correct

                    ? "correct"

                    : "wrong"

            );

        }


        /*
            Only the host advances
            the question.

            This prevents both
            devices from trying to
            advance at the same time.
        */

        setTimeout(
            async function() {

                const latest =
                    await getDoc(
                        doc(
                            db,
                            "triviaRooms",
                            currentRoom
                        )
                    );


                if (
                    !latest.exists()
                )
                    return;


                const latestRoom =
                    latest.data();


                if (
                    latestRoom.playerAnswered
                ) {

                    moveToNextQuestion(
                        latestRoom
                    );

                }

            },
            1200
        );

    }

}


/* =========================
   NEXT QUESTION
========================= */

async function moveToNextQuestion(
    room
) {

    if (advancing)
        return;


    advancing = true;


    try {

        if (
            room.currentQuestion + 1 >=
            room.questions.length
        ) {

            await updateDoc(

                doc(
                    db,
                    "triviaRooms",
                    currentRoom
                ),

                {
                    status:
                        "finished"
                }

            );

        }

        else {

            await updateDoc(

                doc(
                    db,
                    "triviaRooms",
                    currentRoom
                ),

                {

                    currentQuestion:
                        room.currentQuestion + 1,

                    playerAnswer:
                        null,

                    playerAnswered:
                        false

                }

            );

        }

    }

    catch(error) {

        console.error(
            error
        );

    }


    setTimeout(
        function() {

            advancing = false;

        },
        500
    );

}

/* =========================
   JOIN ROOM
========================= */

async function joinRoom() {

    const name =
        document
        .getElementById(
            "playerName"
        )
        .value
        .trim();


    const roomCode =
        document
        .getElementById(
            "roomCode"
        )
        .value
        .trim();


    const error =
        document
        .getElementById(
            "joinError"
        );


    error.textContent = "";


    if (!name) {

        error.textContent =
            "Enter your name.";

        return;

    }


    if (
        !/^\d{4}$/.test(
            roomCode
        )
    ) {

        error.textContent =
            "Room code must be 4 numbers.";

        return;

    }


    if (!currentUser) {

        error.textContent =
            "You need to be logged in first.";

        return;

    }


    try {

        const roomReference =
            doc(
                db,
                "triviaRooms",
                roomCode
            );


        const snapshot =
            await getDoc(
                roomReference
            );


        if (
            !snapshot.exists()
        ) {

            error.textContent =
                "That room doesn't exist.";

            return;

        }


        const room =
            snapshot.data();


        if (
            room.playerId
        ) {

            error.textContent =
                "That room already has a player.";

            return;

        }


        await updateDoc(

            roomReference,

            {

                playerId:
                    currentUser.uid,

                playerName:
                    name

            }

        );


        currentRoom =
            roomCode;


        showPlayerRoom(
            roomCode
        );


        listenToRoom(
            roomCode
        );

    }

    catch(errorObject) {

        console.error(
            errorObject
        );

        error.textContent =
            "Could not join the room.";

    }

}

========================= */

async function submitAnswer(
    answer,
    room
) {

    if (
        room.playerAnswered
    )
        return;


    const question =
        room.questions[
            room.currentQuestion
        ];


    const correct =
        answer ===
        question.correct;


    try {

        await updateDoc(

            doc(
                db,
                "triviaRooms",
                currentRoom
            ),

            {

                playerAnswer:
                    answer,

                playerAnswered:
                    true,

                playerScore:
                    correct
                    ? room.playerScore + 1
                    : room.playerScore

            }

        );

    }

    catch(error) {

        console.error(
            error
        );

    }

}

        ? room.playerScore

    let result;

    ) {

/* RANDOM ROUND */

async function createRandomRound() {

    if (!currentUser) {

        alert(
            "You need to be logged in first."
        );

        return;

    }


    /*
        Make a copy so we don't modify
        the original question bank.
    */

    const shuffled =
        [...randomQuestionBank];


    /*
        Fisher-Yates shuffle
    */

    for (
        let i = shuffled.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];

    }


    /*
        Pick 10 unique questions.
    */

    questions =
        shuffled.slice(
            0,
            Math.min(
                10,
                shuffled.length
            )
        );


    if (
        questions.length === 0
    ) {

        alert(
            "There are no random questions available."
        );

        return;

    }


    await createRoom();

}

        playerName:

        currentQuestion:
            0,

        hostScore:
            0,

        playerScore:
            0,

        playerAnswer:
            null,

        playerAnswered:
            false,

        status:
            "waiting",

        createdAt:
            Date.now()

    };


    try {

        await setDoc(
            doc(
                db,

            ),
            room
        );


        currentRoom =
            roomCode;


        showHostRoom(

        );

    }

    catch(error) {

        console.error(error);

        );

    }

}

/* JOIN ROOM */

async function joinRoom() {

    const name =
        document
        .getElementById("playerName")
        .value
        .trim();


    const roomCode =
        document
        .getElementById("roomCode")
        .value
        .trim();


    const error =
        document
        .getElementById("joinError");


    error.textContent = "";


    if (!name) {

        error.textContent =
            "Enter your name.";

        return;

    }


    if (
        !/^\d{4}$/.test(
            roomCode
        )
    ) {

        error.textContent =
            "Room code must be 4 numbers.";

        return;

    }


    if (!currentUser) {

        error.textContent =
            "You need to be logged in first.";

        return;

    }


    try {

        const roomReference =
            doc(
                db,
                "triviaRooms",
                roomCode
            );


        const snapshot =
            await getDoc(
                roomReference
            );


        if (!snapshot.exists()) {

            error.textContent =
                "That room doesn't exist.";

            return;

        }


        const room =
            snapshot.data();


        if (room.playerId) {

            error.textContent =
                "That room already has a player.";

            return;

        }


        await updateDoc(
            roomReference,
            {

                playerId:
                    currentUser.uid,

                playerName:
                    name

            }
        );


        currentRoom =
            roomCode;


        showPlayerRoom(
            roomCode
        );


        listenToRoom(
            roomCode
        );

    }

    catch(errorObject) {

        console.error(
            errorObject
        );

        error.textContent =
            "Could not join the room.";

    }

}

async function submitAnswer(
    answer,
    room
) {

    if (
        room.playerAnswered
    )
        return;


    const question =
        room.questions[
            room.currentQuestion
        ];


    const correct =
        answer ===
        question.correct;


    try {

        await updateDoc(
            doc(
                db,
                "triviaRooms",
                currentRoom
            ),
            {

                playerAnswer:
                    answer,

                playerAnswered:
                    true,

                playerScore:
                    correct
                    ? room.playerScore + 1
                    : room.playerScore

            }
        );

    }

    catch(error) {

        console.error(
            error
        );

    }

}
